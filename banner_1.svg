<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Sonam Narula: software engineering, DSA and CP, AI and GenAI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.45" stop-color="#071A35"/>
      <stop offset="0.8" stop-color="#0E3A5D"/>
      <stop offset="1" stop-color="#1b1033"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <radialGradient id="gA" cx="0.12" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.22"/><stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gB" cx="0.95" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.35"/><stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity="0.06"/></pattern>
  </defs>
  <rect width="1280" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="22" fill="url(#dots)"/>
  <rect width="1280" height="340" rx="22" fill="url(#gA)"/>
  <rect width="1280" height="340" rx="22" fill="url(#gB)"/>
  <rect x="1" y="1" width="1278" height="338" rx="21" fill="none" stroke="#7DD3FC" stroke-opacity="0.18"/>

  <!-- left block -->
  <text x="84" y="92" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#7DD3FC">SOFTWARE ENGINEERING  ·  DSA / CP  ·  AI / GENAI</text>
  <text x="80" y="178" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="800" fill="#FFFFFF" textLength="620" lengthAdjust="spacingAndGlyphs">Sonam Narula</text>
  <rect x="84" y="194" width="96" height="4" rx="2" fill="#EC4899"/>
  <text x="84" y="230" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#CBD5E1">building things to understand how they work.</text>

  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700">
    <rect x="84" y="254" width="384" height="34" rx="17" fill="#EC4899"/>
    <text x="276" y="276" text-anchor="middle" fill="#fff" letter-spacing="1">ICPC ALGO QUEEN 2026 · #386 / 1,063</text>
    <rect x="482" y="254" width="226" height="34" rx="17" fill="#071A35" stroke="#7DD3FC" stroke-opacity="0.6"/>
    <text x="595" y="276" text-anchor="middle" fill="#7DD3FC" letter-spacing="1">LEETCODE · KNIGHT</text>
    <rect x="722" y="254" width="196" height="34" rx="17" fill="#071A35" stroke="#7DD3FC" stroke-opacity="0.6"/>
    <text x="820" y="276" text-anchor="middle" fill="#7DD3FC" letter-spacing="1">DEUTSCH · LERNEN</text>
  </g>

  <!-- terminal card -->
  <g transform="translate(944 62)">
    <rect width="296" height="216" rx="14" fill="#050816" fill-opacity="0.85" stroke="#7DD3FC" stroke-opacity="0.35"/>
    <circle cx="22" cy="22" r="5.5" fill="#ff5f57"/><circle cx="42" cy="22" r="5.5" fill="#febc2e"/><circle cx="62" cy="22" r="5.5" fill="#28c840"/>
    <line x1="0" y1="44" x2="296" y2="44" stroke="#7DD3FC" stroke-opacity="0.15"/>
    <g font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15">
      <text x="24" y="74" fill="#7DD3FC">~ % whoami</text>
      <text x="24" y="96" fill="#E2E8F0">sonam_narula</text>
      <text x="24" y="128" fill="#7DD3FC">~ % status</text>
      <text x="24" y="150" fill="#E2E8F0">läuft · running</text>
      <text x="24" y="182" fill="#7DD3FC">~ % next</text>
