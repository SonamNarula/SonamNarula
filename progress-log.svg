<svg width="920" height="310" viewBox="0 0 920 310" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip_progress"><rect width="920" height="310" rx="20"/></clipPath>
    <linearGradient id="edge_progress" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9ece6a" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="glass_progress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb1_progress" cx="15%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2_progress" cx="100%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .lbl{font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:13px;font-weight:700;}
    .val{fill:#e8eaf6;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:13px;font-weight:700;}
    .det{fill:#7982a9;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:12px;}
    .title{fill:#7982a9;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:12.5px;letter-spacing:.4px;}
    .prompt{fill:#9ece6a;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:13px;}
    .dot-live{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.82);}}
    .row{opacity:1;animation:rise .6s cubic-bezier(.16,1,.3,1) both;}
    @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
    .sheen{animation:sheen 6s ease-in-out infinite;}
    @keyframes sheen{0%,100%{opacity:.5;}50%{opacity:1;}}
  </style>
  <g clip-path="url(#clip_progress)">
    <rect width="920" height="310" fill="#0d0e14"/>
    <rect width="920" height="310" fill="url(#orb1_progress)"/>
    <rect width="920" height="310" fill="url(#orb2_progress)"/>
    <rect width="920" height="310" fill="url(#glass_progress)"/>
    <rect width="920" height="42" fill="#0a0a0f" opacity="0.75"/>
    <rect x="0" y="41" width="920" height="1.6" fill="url(#edge_progress)" class="sheen"/>
    <circle cx="23" cy="21" r="6" fill="#f7768e"/><circle cx="43" cy="21" r="6" fill="#e0af68"/>
    <circle cx="63" cy="21" r="6" fill="#9ece6a" class="dot-live"/>
    <text x="460.0" y="26" text-anchor="middle" class="title">sonam@github — progress</text>

    <text x="40" y="70" class="prompt">~ % cat progress.log</text>

    <g class="row" style="animation-delay:0.10s">
      <line x1="40" y1="93" x2="880" y2="93" stroke="#2a2d42" stroke-width="1" opacity="0.5"/>
      <text x="40" y="118" class="lbl" fill="#e0af68">LeetCode</text>
      <text x="210" y="118" class="val">500+ solved</text>
      <text x="400" y="118" class="det">→ sonamnarula2005</text>
    </g>

    <g class="row" style="animation-delay:0.15s">
      <line x1="40" y1="133" x2="880" y2="133" stroke="#2a2d42" stroke-width="1" opacity="0.5"/>
      <text x="40" y="158" class="lbl" fill="#7aa2f7">Total DSA</text>
      <text x="210" y="158" class="val">1300+ solved</text>
      <text x="400" y="158" class="det">→ across LeetCode, Codeforces, CSES, GFG, CodeChef</text>
    </g>

    <g class="row" style="animation-delay:0.20s">
      <line x1="40" y1="173" x2="880" y2="173" stroke="#2a2d42" stroke-width="1" opacity="0.5"/>
      <text x="40" y="198" class="lbl" fill="#f7768e">Codeforces</text>
      <text x="210" y="198" class="val">active</text>
      <text x="400" y="198" class="det">→ ghostcommit.cpp</text>
    </g>

    <g class="row" style="animation-delay:0.25s">
      <line x1="40" y1="213" x2="880" y2="213" stroke="#2a2d42" stroke-width="1" opacity="0.5"/>
      <text x="40" y="238" class="lbl" fill="#9ece6a">GFG</text>
      <text x="210" y="238" class="val">active</text>
      <text x="400" y="238" class="det">→ sonamnapaqc</text>
    </g>

    <g class="row" style="animation-delay:0.30s">
      <line x1="40" y1="253" x2="880" y2="253" stroke="#2a2d42" stroke-width="1" opacity="0.5"/>
      <text x="40" y="278" class="lbl" fill="#bb9af7">Track</text>
      <text x="210" y="278" class="det" font-size="12.5">ICPC-style CP + pattern-wise DSA (450–500 core patterns, 20+ categories)</text>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="918.5" height="308.5" rx="19.5" fill="none" stroke="url(#edge_progress)" stroke-width="1.4" opacity="0.7"/>
</svg>
