      <text x="868" y="156" text-anchor="end" class="v" font-size="14">★ 0</text>
      <text x="50" y="179" class="m" font-size="12.5">Real-time collaborative code editor with live cursors &amp; CRDT-based sync</text>
      <text x="50" y="199" class="m" font-size="11.5" opacity="0.75">Multi-user editing • conflict-free merge logic • Monaco-powered syntax highlighting</text>
      <g class="row" style="animation-delay:0.15s">
