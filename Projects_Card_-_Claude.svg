      <text x="50" y="347" class="m" font-size="12.5">DSA tracker &amp; productivity suite — streaks, heatmaps, spaced repetition</text>
      <text x="50" y="367" class="m" font-size="11.5" opacity="0.75">Problem logging • revision scheduler • progress analytics dashboard</text>
