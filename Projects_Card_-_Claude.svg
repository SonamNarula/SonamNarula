        <text x="316.4" y="231" text-anchor="middle" class="m" font-size="11">Monaco</text>
      </g>
      <g class="row" style="animation-delay:0.20s">
        <a href="https://codefusion-collaborative-editor.vercel.app" xlink:href="https://codefusion-collaborative-editor.vercel.app" target="_blank">
          <text x="50" y="255" class="link">↗ Live: codefusion-collaborative-editor.vercel.app</text>
        </a>
      </g>
    </g>

    <!-- Trackify -->
