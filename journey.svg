<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 920 190" width="920" height="190" role="img" aria-label="Journey: C/C++, then DSA and CP, then software, then Python and AI, next Deutschland" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
