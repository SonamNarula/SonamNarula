      <stop offset="0" stop-color="#7DD3FC"/><stop offset="0.8" stop-color="#12618C"/><stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="918" height="188" rx="18" fill="#050816" stroke="#7DD3FC" stroke-opacity="0.2"/>
  <line x1="110" y1="74" x2="810" y2="74" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
  <line x1="640" y1="74" x2="810" y2="74" stroke="#EC4899" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>

  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" text-anchor="middle">
