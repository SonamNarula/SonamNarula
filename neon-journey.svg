<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Journey: fundamentals, competitive coding, building software, Python and AI" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
