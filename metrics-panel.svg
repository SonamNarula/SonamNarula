<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip_metrics"><rect width="900" height="200" rx="20"/></clipPath>
    <linearGradient id="edge_metrics" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9ece6a" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="glass_metrics" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb1_metrics" cx="15%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2_metrics" cx="100%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur_metrics"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="soft_metrics" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .k{fill:#9ece6a;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:14px;font-weight:700;}
    .v{fill:#e8eaf6;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:14px;}
    .m{fill:#7982a9;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:12.5px;}
    .b{fill:#7aa2f7;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:14px;font-weight:700;}
    .title{fill:#7982a9;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:12.5px;letter-spacing:.4px;}
    .prompt{fill:#9ece6a;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:13px;}
    .cursor{animation:blink 1.1s step-end infinite;}
    @keyframes blink{50%{opacity:0;}}
    .dot-live{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.82);}}
    .row{opacity:1;animation:rise .6s cubic-bezier(.16,1,.3,1) both;}
    @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
    .sheen{animation:sheen 6s ease-in-out infinite;}
    @keyframes sheen{0%,100%{opacity:.5;}50%{opacity:1;}}
    .float{animation:float 5s ease-in-out infinite;}
    @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  </style>
  <g clip-path="url(#clip_metrics)">
    <rect width="900" height="200" fill="#0d0e14"/>
    <rect width="900" height="200" fill="url(#orb1_metrics)"/>
    <rect width="900" height="200" fill="url(#orb2_metrics)"/>
    <rect width="900" height="200" fill="url(#glass_metrics)"/>
    <rect width="900" height="42" fill="#0a0a0f" opacity="0.75"/>
    <rect x="0" y="41" width="900" height="1.6" fill="url(#edge_metrics)" class="sheen"/>
    <circle cx="23" cy="21" r="6" fill="#f7768e"/><circle cx="43" cy="21" r="6" fill="#e0af68"/>
    <circle cx="63" cy="21" r="6" fill="#9ece6a" class="dot-live"/>
    <text x="450.0" y="26" text-anchor="middle" class="title">sonam@github — metrics</text>
    <text x="28" y="70" class="prompt">~ % stats --year --live</text>
    <g class="row" style="animation-delay:0.15s">
      <text x="169" y="130" text-anchor="middle" fill="#7aa2f7" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="34" font-weight="700">1,229</text>
      <text x="169" y="152" text-anchor="middle" class="m" font-size="12">Total Contributions</text>
    </g>
    <g class="row" style="animation-delay:0.27s">
      <line x1="309" y1="90" x2="309" y2="160" stroke="#2a2d42" stroke-width="1"/>
      <text x="450" y="130" text-anchor="middle" fill="#9ece6a" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="34" font-weight="700">7</text>
      <text x="450" y="152" text-anchor="middle" class="m" font-size="12">Current Streak (days)</text>
    </g>
    <g class="row" style="animation-delay:0.39s">
      <line x1="591" y1="90" x2="591" y2="160" stroke="#2a2d42" stroke-width="1"/>
      <text x="731" y="130" text-anchor="middle" fill="#bb9af7" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="34" font-weight="700">49</text>
      <text x="731" y="152" text-anchor="middle" class="m" font-size="12">Longest Streak (days)</text>
    </g>
    <line x1="28" y1="168" x2="872" y2="168" stroke="#2a2d42" stroke-width="1"/>
    <text x="28" y="188" class="m" font-size="11">last updated <tspan fill="#7aa2f7">2026-08-02</tspan> &#183; auto-refreshed daily via GitHub Actions</text>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="198.5" rx="19.5" fill="none" stroke="url(#edge_metrics)" stroke-width="1.4" opacity="0.7"/>
</svg>
