<svg width="1200" height="460" viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip_hero"><rect width="1200" height="460" rx="28"/></clipPath>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7"/><stop offset="50%" stop-color="#bb9af7"/><stop offset="100%" stop-color="#9ece6a"/>
    </linearGradient>

    <radialGradient id="orb1" cx="8%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.22"/><stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="100%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.20"/><stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="75%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#9ece6a" stop-opacity="0.14"/><stop offset="100%" stop-color="#9ece6a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.075"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/><stop offset="50%" stop-color="#bb9af7"/><stop offset="100%" stop-color="#9ece6a"/>
    </linearGradient>

    <pattern id="dotgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#e8eaf6" opacity="0.05"/>
    </pattern>

    <filter id="avatarGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .hprompt { fill:#9ece6a; font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace; font-size:15px; }
    .htitle  { fill:#e8eaf6; font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace; font-size:66px; font-weight:700; letter-spacing:1.5px; }
    .hsub    { fill:#7982a9; font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace; font-size:16.5px; }
    .barlabel{ fill:#7982a9; font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace; font-size:12.5px; letter-spacing:.4px; }
    .stat-n  { font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace; font-size:32px; font-weight:700; }
    .stat-l  { fill:#7982a9; font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace; font-size:11.5px; letter-spacing:.3px; }
    .ghost   { fill:#e8eaf6; font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace; font-size:14px; opacity:0.05; }
    .mono-txt{ fill:#e8eaf6; font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace; font-size:26px; font-weight:700; }

    .hcursor { animation: hblink 1.1s step-end infinite; }
    @keyframes hblink { 50% { opacity:0; } }

    .hdot { animation: hpulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes hpulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }

    .sheen { animation: sheen 6s ease-in-out infinite; }
    @keyframes sheen { 0%,100% { opacity:.55; } 50% { opacity:1; } }

    .hfloat { animation: hfloat 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes hfloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }

    .rise { opacity:0; animation: rise .7s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

    .spin { animation: spin 14s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
  </style>

  <g clip-path="url(#clip_hero)">
    <rect width="1200" height="460" fill="#0d0e14"/>
    <rect width="1200" height="460" fill="url(#dotgrid)"/>
    <rect width="1200" height="460" fill="url(#orb1)"/>
    <rect width="1200" height="460" fill="url(#orb2)"/>
    <rect width="1200" height="460" fill="url(#orb3)"/>
    <rect width="1200" height="460" fill="url(#glass)"/>

    <rect width="1200" height="48" fill="#0a0a0f" opacity="0.7"/>
    <rect x="0" y="47" width="1200" height="2" fill="url(#edge)" class="sheen"/>
    <circle cx="28" cy="24" r="7" fill="#f7768e"/>
    <circle cx="50" cy="24" r="7" fill="#e0af68"/>
    <circle cx="72" cy="24" r="7" fill="#9ece6a" class="hdot"/>
    <text x="600.0" y="29" text-anchor="middle" class="barlabel">sonam@github &#8212; ~</text>
    <text x="640" y="90" class="ghost">const engineer = {</text>
    <text x="640" y="114" class="ghost">  name: 'Sonam Narula',</text>
    <text x="640" y="138" class="ghost">  focus: ['DSA','CP','AI/ML'],</text>
    <text x="640" y="162" class="ghost">  status: 'building',</text>
    <text x="640" y="186" class="ghost">  target: 'Germany'</text>
    <text x="640" y="210" class="ghost">};</text>

    <g class="rise" style="animation-delay:0.05s">
      <text x="70" y="118" class="hprompt">~ % whoami --verbose</text>
    </g>

    <g class="rise" style="animation-delay:0.15s">
      <text x="68" y="205" class="htitle">SONAM NARULA</text>
    </g>

    <g class="rise" style="animation-delay:0.28s">
      <text x="70" y="240" class="hsub">final-year CSE @ JECRC &#183; DSA Captain @ Devcrest JU &#183; building toward AI/ML + Germany<tspan class="hcursor" fill="#9ece6a"> &#9608;</tspan></text>
    </g>

    <g class="hfloat">
      <circle cx="1040" cy="168" r="83" fill="none" stroke="url(#ring)" stroke-width="2.5" opacity="0.55" class="spin" stroke-dasharray="6 10"/>
      <circle cx="1040" cy="168" r="76" fill="#0d0e14" stroke="url(#ring)" stroke-width="2.5" filter="url(#avatarGlow)"/>
      <text x="1040" y="183" text-anchor="middle" class="mono-txt">SN</text>
      <circle cx="1106" cy="234" r="9" fill="#0d0e14"/>
      <circle cx="1106" cy="234" r="6" fill="#9ece6a" class="hdot"/>
    </g>
    <line x1="70" y1="264" x2="1130" y2="264" stroke="#e8eaf6" stroke-opacity="0.08" stroke-width="1"/>
    <g class="rise" style="animation-delay:0.40s">
      <rect x="70.0" y="294" width="248.5" height="118" rx="16" fill="#14161f" opacity="0.7" stroke="#e8eaf6" stroke-opacity="0.09"/>
      <rect x="70.0" y="294" width="248.5" height="3" rx="1.5" fill="#9ece6a" opacity="0.85"/>
      <text x="194.2" y="352" text-anchor="middle" fill="#9ece6a" class="stat-n">500+</text>
      <text x="194.2" y="380" text-anchor="middle" class="stat-l">LEETCODE SOLVED</text>
    </g>
    <g class="rise" style="animation-delay:0.50s">
      <rect x="340.5" y="294" width="248.5" height="118" rx="16" fill="#14161f" opacity="0.7" stroke="#e8eaf6" stroke-opacity="0.09"/>
      <rect x="340.5" y="294" width="248.5" height="3" rx="1.5" fill="#7aa2f7" opacity="0.85"/>
      <text x="464.8" y="352" text-anchor="middle" fill="#7aa2f7" class="stat-n">1300+</text>
      <text x="464.8" y="380" text-anchor="middle" class="stat-l">DSA QS · ALL PLATFORMS</text>
    </g>
    <g class="rise" style="animation-delay:0.60s">
      <rect x="611.0" y="294" width="248.5" height="118" rx="16" fill="#14161f" opacity="0.7" stroke="#e8eaf6" stroke-opacity="0.09"/>
      <rect x="611.0" y="294" width="248.5" height="3" rx="1.5" fill="#bb9af7" opacity="0.85"/>
      <text x="735.2" y="352" text-anchor="middle" fill="#bb9af7" class="stat-n">400+</text>
      <text x="735.2" y="380" text-anchor="middle" class="stat-l">DEVCREST MEMBERS LED</text>
    </g>
    <g class="rise" style="animation-delay:0.70s">
      <rect x="881.5" y="294" width="248.5" height="118" rx="16" fill="#14161f" opacity="0.7" stroke="#e8eaf6" stroke-opacity="0.09"/>
      <rect x="881.5" y="294" width="248.5" height="3" rx="1.5" fill="#7dcfff" opacity="0.85"/>
      <text x="1005.8" y="352" text-anchor="middle" fill="#7dcfff" class="stat-n">2027</text>
      <text x="1005.8" y="380" text-anchor="middle" class="stat-l">BATCH · PLACEMENT CYCLE</text>
    </g>
  </g>
  <rect x="0.9" y="0.9" width="1198.2" height="458.2" rx="27" fill="none" stroke="url(#edge)" stroke-width="1.8" opacity="0.6"/>
</svg>
