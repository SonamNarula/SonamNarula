<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-label="Sonam Narula: Software Engineer, Competitive Programmer, Applied AI Builder" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04060C"/><stop offset="1" stop-color="#0A1226"/></linearGradient>
    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#00F5A0"/><stop offset="0.33" stop-color="#00D9F5"/><stop offset="0.66" stop-color="#5B8CFF"/><stop offset="1" stop-color="#00F5A0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1200 0" to="0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F5A0" stop-opacity="0"/><stop offset="0.5" stop-color="#00D9F5"/><stop offset="1" stop-color="#5B8CFF" stop-opacity="0"/></linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#00D9F5" stroke-opacity="0.07"/></pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#FFFFFF" fill-opacity="0.025"/></pattern>
    <clipPath id="clip"><rect width="1200" height="390" rx="20"/></clipPath>
    <clipPath id="type"><rect x="60" y="72" width="120" height="34"><animate attributeName="width" values="0;120;120;0" keyTimes="0;0.15;0.92;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="390" fill="url(#bg)"/>
    <rect width="1200" height="390" fill="url(#grid)"/>
    <circle cx="140" cy="120" r="170" fill="#00F5A0" opacity="0.16" filter="url(#blur)"><animate attributeName="cx" values="140;300;140" dur="15s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="300" r="190" fill="#5B8CFF" opacity="0.26" filter="url(#blur)"><animate attributeName="cx" values="1080;900;1080" dur="17s" repeatCount="indefinite"/></circle>
    <rect width="1200" height="390" fill="url(#scan)"/>

    <!-- terminal chrome -->
    <rect width="1200" height="44" fill="#0A0F1E"/>
    <rect y="43" width="1200" height="1" fill="#00D9F5" fill-opacity="0.25"/>
    <circle cx="28" cy="22" r="6" fill="#FF5F56"/><circle cx="50" cy="22" r="6" fill="#FFBD2E"/><circle cx="72" cy="22" r="6" fill="#27C93F"/>
    <text x="600" y="27" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,'Liberation Mono',monospace" font-size="13" fill="#7D8CA8">sonam@narula: ~/portfolio  —  zsh</text>
    <text x="1172" y="27" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,'Liberation Mono',monospace" font-size="12" fill="#00F5A0">● online</text>

    <!-- whoami -->
    <g clip-path="url(#type)">
      <text x="60" y="97" font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,'Liberation Mono',monospace" font-size="21" fill="#00F5A0">$ <tspan fill="#E6F1FF">whoami</tspan></text>
    </g>
    <rect x="166" y="80" width="11" height="22" fill="#00F5A0"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>

    <!-- name -->
    <text x="600" y="210" text-anchor="middle" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="84" font-weight="800" letter-spacing="7" fill="url(#neon)" opacity="0.45" filter="url(#glow)">SONAM NARULA</text>
    <text x="600" y="210" text-anchor="middle" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="84" font-weight="800" letter-spacing="7" fill="url(#neon)">SONAM NARULA</text>

    <!-- rotating role -->
    <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,'Liberation Mono',monospace" font-size="27" text-anchor="middle" fill="#5B8CFF">
      <text x="600" y="258" opacity="1">&lt;<tspan fill="#00F5A0">SoftwareEngineer</tspan> /&gt;
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.29;0.33;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="600" y="258" opacity="0">&lt;<tspan fill="#00F5A0">CompetitiveProgrammer</tspan> /&gt;
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.37;0.62;0.66;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="600" y="258" opacity="0">&lt;<tspan fill="#00F5A0">AppliedAIBuilder</tspan> /&gt;
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.70;0.95;0.99;1" dur="9s" repeatCount="indefinite"/></text>
    </g>

    <text x="600" y="296" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,'Liberation Mono',monospace" font-size="14" letter-spacing="0.5" fill="#7D8CA8">final-year CS @ JECRC University, Jaipur  ·  C++  ·  Python  ·  React  ·  GenAI</text>

    <!-- chips -->
    <g font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#E6F1FF" text-anchor="middle">
      <rect x="86" y="322" width="250" height="38" rx="19" fill="#0A1226" stroke="#FFA116" stroke-opacity="0.55"/><circle cx="108" cy="341" r="4" fill="#FFA116"/><text x="226" y="346">LeetCode Knight  ·  Top 0.5%</text>
      <rect x="352" y="322" width="230" height="38" rx="19" fill="#0A1226" stroke="#00F5A0" stroke-opacity="0.5"/><circle cx="374" cy="341" r="4" fill="#00F5A0"/><text x="474" y="346">ICPC Algo Queen  #386</text>
      <rect x="598" y="322" width="260" height="38" rx="19" fill="#0A1226" stroke="#00D9F5" stroke-opacity="0.5"/><circle cx="620" cy="341" r="4" fill="#00D9F5"/><text x="744" y="346">AtCoder Debut  92 / 10,763</text>
      <rect x="874" y="322" width="240" height="38" rx="19" fill="#0A1226" stroke="#5B8CFF" stroke-opacity="0.55"/><circle cx="896" cy="341" r="4" fill="#5B8CFF"/><text x="1000" y="346">400+ DSA Community Led</text>
    </g>
    <rect x="0" y="388" width="1200" height="2" fill="url(#edge)"/>
  </g>
  <rect x="1" y="1" width="1198" height="388" rx="19" fill="none" stroke="#00D9F5" stroke-opacity="0.3"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
