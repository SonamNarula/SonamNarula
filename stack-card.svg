<svg width="920" height="440" viewBox="0 0 920 440" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="clip_stack"><rect width="920" height="440" rx="20"/></clipPath>
    <linearGradient id="edge_stack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9ece6a" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="glass_stack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb1_stack" cx="15%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2_stack" cx="100%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>

    <symbol id="ic-lang" viewBox="0 0 16 16">
      <path d="M5 3 L1 8 L5 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M11 3 L15 8 L11 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ic-ai" viewBox="0 0 16 16">
      <circle cx="8" cy="3" r="1.8" fill="currentColor"/><circle cx="3" cy="12" r="1.8" fill="currentColor"/><circle cx="13" cy="12" r="1.8" fill="currentColor"/>
      <line x1="8" y1="3" x2="3" y2="12" stroke="currentColor" stroke-width="1"/>
      <line x1="8" y1="3" x2="13" y2="12" stroke="currentColor" stroke-width="1"/>
      <line x1="3" y1="12" x2="13" y2="12" stroke="currentColor" stroke-width="1"/>
    </symbol>
    <symbol id="ic-data" viewBox="0 0 16 16">
      <ellipse cx="8" cy="4" rx="6" ry="2.2" fill="currentColor"/>
      <path d="M2 4 v8 a6 2.2 0 0 0 12 0 v-8" fill="none" stroke="currentColor" stroke-width="1.3"/>
    </symbol>
    <symbol id="ic-web" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <ellipse cx="8" cy="8" rx="2.4" ry="6" fill="none" stroke="currentColor" stroke-width="1.1"/>
      <line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.1"/>
    </symbol>
    <symbol id="ic-tools" viewBox="0 0 16 16">
      <rect x="6.5" y="1" width="3" height="14" rx="1.4" fill="currentColor" transform="rotate(45 8 8)"/>
      <circle cx="4.5" cy="11.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4" transform="rotate(45 8 8)"/>
    </symbol>
  </defs>
  <style>
    .m{fill:#7982a9;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:12.5px;}
    .title{fill:#7982a9;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:12.5px;letter-spacing:.4px;}
    .prompt{fill:#9ece6a;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:13px;}
    .cat{font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:13px;font-weight:700;letter-spacing:.5px;}
    .badge{fill:#e8eaf6;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:11.5px;}
    .dot-live{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.82);}}
    .sheen{animation:sheen 6s ease-in-out infinite;}
    @keyframes sheen{0%,100%{opacity:.5;}50%{opacity:1;}}
    .row{opacity:1;animation:rise .6s cubic-bezier(.16,1,.3,1) both;}
    @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  </style>
  <g clip-path="url(#clip_stack)">
    <rect width="920" height="440" fill="#0d0e14"/>
    <rect width="920" height="440" fill="url(#orb1_stack)"/>
    <rect width="920" height="440" fill="url(#orb2_stack)"/>
    <rect width="920" height="440" fill="url(#glass_stack)"/>
    <rect width="920" height="42" fill="#0a0a0f" opacity="0.75"/>
    <rect x="0" y="41" width="920" height="1.6" fill="url(#edge_stack)" class="sheen"/>
    <circle cx="23" cy="21" r="6" fill="#f7768e"/><circle cx="43" cy="21" r="6" fill="#e0af68"/>
    <circle cx="63" cy="21" r="6" fill="#9ece6a" class="dot-live"/>
    <text x="460" y="26" text-anchor="middle" class="title">sonam@github — stack</text>

    <text x="40" y="70" class="prompt">~ % cat stack.txt</text>

    <!-- LANGUAGES -->
    <g class="row" style="animation-delay:0.06s">
      <text x="40" y="100" class="cat" fill="#e0af68">LANGUAGES</text>
      <g style="color:#e0af68">
        <rect x="40" y="112" width="66" height="26" rx="13" fill="#171a28" stroke="#e0af68" stroke-opacity="0.35"/>
        <use href="#ic-lang" xlink:href="#ic-lang" x="48" y="118" width="14" height="14"/>
        <text x="68" y="129" class="badge">C++</text>

        <rect x="116" y="112" width="116" height="26" rx="13" fill="#171a28" stroke="#e0af68" stroke-opacity="0.35"/>
        <use href="#ic-lang" xlink:href="#ic-lang" x="124" y="118" width="14" height="14"/>
        <text x="144" y="129" class="badge">TypeScript</text>

        <rect x="242" y="112" width="116" height="26" rx="13" fill="#171a28" stroke="#e0af68" stroke-opacity="0.35"/>
        <use href="#ic-lang" xlink:href="#ic-lang" x="250" y="118" width="14" height="14"/>
        <text x="270" y="129" class="badge">JavaScript</text>

        <rect x="368" y="112" width="87" height="26" rx="13" fill="#171a28" stroke="#e0af68" stroke-opacity="0.35"/>
        <use href="#ic-lang" xlink:href="#ic-lang" x="376" y="118" width="14" height="14"/>
        <text x="396" y="129" class="badge">Python</text>

        <rect x="465" y="112" width="66" height="26" rx="13" fill="#171a28" stroke="#e0af68" stroke-opacity="0.35"/>
        <use href="#ic-lang" xlink:href="#ic-lang" x="473" y="118" width="14" height="14"/>
        <text x="493" y="129" class="badge">SQL</text>
      </g>
    </g>

    <!-- AI / ML -->
    <g class="row" style="animation-delay:0.12s">
      <text x="40" y="164" class="cat" fill="#bb9af7">AI / ML</text>
      <g style="color:#bb9af7">
        <rect x="40" y="176" width="94" height="26" rx="13" fill="#171a28" stroke="#bb9af7" stroke-opacity="0.35"/>
        <use href="#ic-ai" xlink:href="#ic-ai" x="48" y="182" width="14" height="14"/>
        <text x="68" y="193" class="badge">PyTorch</text>

        <rect x="144" y="176" width="116" height="26" rx="13" fill="#171a28" stroke="#bb9af7" stroke-opacity="0.35"/>
        <use href="#ic-ai" xlink:href="#ic-ai" x="152" y="182" width="14" height="14"/>
        <text x="172" y="193" class="badge">TensorFlow</text>

        <rect x="270" y="176" width="130" height="26" rx="13" fill="#171a28" stroke="#bb9af7" stroke-opacity="0.35"/>
        <use href="#ic-ai" xlink:href="#ic-ai" x="278" y="182" width="14" height="14"/>
        <text x="298" y="193" class="badge">scikit-learn</text>

        <rect x="410" y="176" width="102" height="26" rx="13" fill="#171a28" stroke="#bb9af7" stroke-opacity="0.35"/>
        <use href="#ic-ai" xlink:href="#ic-ai" x="418" y="182" width="14" height="14"/>
        <text x="438" y="193" class="badge">Prophet</text>
      </g>
    </g>

    <!-- DATA -->
    <g class="row" style="animation-delay:0.18s">
      <text x="40" y="228" class="cat" fill="#9ece6a">DATA</text>
      <g style="color:#9ece6a">
        <rect x="40" y="240" width="87" height="26" rx="13" fill="#171a28" stroke="#9ece6a" stroke-opacity="0.35"/>
        <use href="#ic-data" xlink:href="#ic-data" x="48" y="246" width="14" height="14"/>
        <text x="68" y="257" class="badge">NumPy</text>

        <rect x="137" y="240" width="87" height="26" rx="13" fill="#171a28" stroke="#9ece6a" stroke-opacity="0.35"/>
        <use href="#ic-data" xlink:href="#ic-data" x="145" y="246" width="14" height="14"/>
        <text x="165" y="257" class="badge">Pandas</text>

        <rect x="234" y="240" width="116" height="26" rx="13" fill="#171a28" stroke="#9ece6a" stroke-opacity="0.35"/>
        <use href="#ic-data" xlink:href="#ic-data" x="242" y="246" width="14" height="14"/>
        <text x="262" y="257" class="badge">PostgreSQL</text>
      </g>
    </g>

    <!-- WEB -->
    <g class="row" style="animation-delay:0.24s">
      <text x="40" y="292" class="cat" fill="#7aa2f7">WEB</text>
      <g style="color:#7aa2f7">
        <rect x="40" y="304" width="80" height="26" rx="13" fill="#171a28" stroke="#7aa2f7" stroke-opacity="0.35"/>
        <use href="#ic-web" xlink:href="#ic-web" x="48" y="310" width="14" height="14"/>
        <text x="68" y="321" class="badge">React</text>

        <rect x="130" y="304" width="102" height="26" rx="13" fill="#171a28" stroke="#7aa2f7" stroke-opacity="0.35"/>
        <use href="#ic-web" xlink:href="#ic-web" x="138" y="310" width="14" height="14"/>
        <text x="158" y="321" class="badge">Tailwind</text>

        <rect x="242" y="304" width="94" height="26" rx="13" fill="#171a28" stroke="#7aa2f7" stroke-opacity="0.35"/>
        <use href="#ic-web" xlink:href="#ic-web" x="250" y="310" width="14" height="14"/>
        <text x="270" y="321" class="badge">Node.js</text>

        <rect x="346" y="304" width="94" height="26" rx="13" fill="#171a28" stroke="#7aa2f7" stroke-opacity="0.35"/>
        <use href="#ic-web" xlink:href="#ic-web" x="354" y="310" width="14" height="14"/>
        <text x="374" y="321" class="badge">Express</text>
      </g>
    </g>

    <!-- TOOLS -->
    <g class="row" style="animation-delay:0.30s">
      <text x="40" y="356" class="cat" fill="#f7768e">TOOLS</text>
      <g style="color:#f7768e">
        <rect x="40" y="368" width="66" height="26" rx="13" fill="#171a28" stroke="#f7768e" stroke-opacity="0.35"/>
        <use href="#ic-tools" xlink:href="#ic-tools" x="48" y="374" width="14" height="14"/>
        <text x="68" y="385" class="badge">Git</text>

        <rect x="116" y="368" width="87" height="26" rx="13" fill="#171a28" stroke="#f7768e" stroke-opacity="0.35"/>
        <use href="#ic-tools" xlink:href="#ic-tools" x="124" y="374" width="14" height="14"/>
        <text x="144" y="385" class="badge">Docker</text>

        <rect x="213" y="368" width="94" height="26" rx="13" fill="#171a28" stroke="#f7768e" stroke-opacity="0.35"/>
        <use href="#ic-tools" xlink:href="#ic-tools" x="221" y="374" width="14" height="14"/>
        <text x="241" y="385" class="badge">Postman</text>

        <rect x="317" y="368" width="94" height="26" rx="13" fill="#171a28" stroke="#f7768e" stroke-opacity="0.35"/>
        <use href="#ic-tools" xlink:href="#ic-tools" x="325" y="374" width="14" height="14"/>
        <text x="345" y="385" class="badge">VS Code</text>
      </g>
    </g>

    <line x1="40" y1="408" x2="880" y2="408" stroke="#2a2d42" stroke-width="1" opacity="0.6"/>
    <text x="40" y="428" class="m" font-size="11">5 languages &#183; 4 ML frameworks &#183; full-stack web &#183; production tooling</text>
  </g>
  <rect x="0.75" y="0.75" width="918.5" height="438.5" rx="19.5" fill="none" stroke="url(#edge_stack)" stroke-width="1.4" opacity="0.7"/>
</svg>
