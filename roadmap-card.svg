<svg width="920" height="260" viewBox="0 0 920 260" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="clip_road"><rect width="920" height="260" rx="20"/></clipPath>
    <linearGradient id="edge_road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9ece6a" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="glass_road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb1_road" cx="15%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2_road" cx="100%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line_active" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9ece6a"/>
      <stop offset="100%" stop-color="#7aa2f7"/>
    </linearGradient>
    <radialGradient id="glow_current" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur_glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <symbol id="ic-code" viewBox="0 0 16 16">
      <path d="M5 3 L1 8 L5 13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M11 3 L15 8 L11 13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ic-briefcase" viewBox="0 0 16 16">
      <rect x="1.5" y="6" width="13" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <path d="M5.5 6 V4.2 a1.6 1.6 0 0 1 1.6-1.6 h1.8 a1.6 1.6 0 0 1 1.6 1.6 V6" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <line x1="1.5" y1="9.5" x2="14.5" y2="9.5" stroke="currentColor" stroke-width="1.1"/>
    </symbol>
    <symbol id="ic-brain" viewBox="0 0 16 16">
      <circle cx="8" cy="3" r="1.9" fill="currentColor"/><circle cx="3" cy="12" r="1.9" fill="currentColor"/><circle cx="13" cy="12" r="1.9" fill="currentColor"/>
      <line x1="8" y1="3" x2="3" y2="12" stroke="currentColor" stroke-width="1.1"/>
      <line x1="8" y1="3" x2="13" y2="12" stroke="currentColor" stroke-width="1.1"/>
      <line x1="3" y1="12" x2="13" y2="12" stroke="currentColor" stroke-width="1.1"/>
    </symbol>
    <symbol id="ic-layers" viewBox="0 0 16 16">
      <rect x="2" y="2" width="12" height="3" rx="1.2" fill="currentColor" opacity="0.95"/>
      <rect x="2" y="6.5" width="12" height="3" rx="1.2" fill="currentColor" opacity="0.65"/>
      <rect x="2" y="11" width="12" height="3" rx="1.2" fill="currentColor" opacity="0.4"/>
    </symbol>
    <symbol id="ic-flag" viewBox="0 0 16 16">
      <line x1="4" y1="1.5" x2="4" y2="14.5" stroke="currentColor" stroke-width="1.5"/>
      <path d="M4 2.5 L13 4.7 L4 8.2 Z" fill="currentColor"/>
    </symbol>
  </defs>
  <style>
    .m{fill:#7982a9;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:11.5px;}
    .title{fill:#7982a9;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:12.5px;letter-spacing:.4px;}
    .prompt{fill:#9ece6a;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:13px;}
    .lbl{fill:#e8eaf6;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:13px;font-weight:700;}
    .status{font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:12px;font-weight:700;}
    .chip{fill:#7982a9;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:11px;}
    .dot-live{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.82);}}
    .sheen{animation:sheen 6s ease-in-out infinite;}
    @keyframes sheen{0%,100%{opacity:.5;}50%{opacity:1;}}
    .row{opacity:1;animation:rise .6s cubic-bezier(.16,1,.3,1) both;}
    @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
    .ping{animation:ping 2s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:center;}
    @keyframes ping{0%{transform:scale(1);opacity:.7;}75%,100%{transform:scale(2.8);opacity:0;}}
    .glowpulse{animation:glowpulse 2.4s ease-in-out infinite;}
    @keyframes glowpulse{0%,100%{opacity:.5;}50%{opacity:1;}}
  </style>
  <g clip-path="url(#clip_road)">
    <rect width="920" height="260" fill="#0d0e14"/>
    <rect width="920" height="260" fill="url(#orb1_road)"/>
    <rect width="920" height="260" fill="url(#orb2_road)"/>
    <rect width="920" height="260" fill="url(#glass_road)"/>
    <rect width="920" height="42" fill="#0a0a0f" opacity="0.75"/>
    <rect x="0" y="41" width="920" height="1.6" fill="url(#edge_road)" class="sheen"/>
    <circle cx="23" cy="21" r="6" fill="#f7768e"/><circle cx="43" cy="21" r="6" fill="#e0af68"/>
    <circle cx="63" cy="21" r="6" fill="#9ece6a" class="dot-live"/>
    <text x="460.0" y="26" text-anchor="middle" class="title">sonam@github — roadmap</text>

    <text x="40" y="70" class="prompt">~ % cat roadmap.md</text>
    <rect x="768" y="56" width="112" height="22" rx="11" fill="#171a28" stroke="#2a2d42"/>
    <circle cx="784" cy="67" r="3" fill="#7aa2f7" class="dot-live"/>
    <text x="794" y="71" class="chip">2 / 5 active</text>

    <!-- glow behind current node -->
    <circle cx="260" cy="145" r="30" fill="url(#glow_current)" filter="url(#blur_glow)" class="glowpulse"/>

    <!-- line -->
    <line x1="60" y1="145" x2="260" y2="145" stroke="url(#line_active)" stroke-width="3"/>
    <line x1="260" y1="145" x2="860" y2="145" stroke="#2a2d42" stroke-width="2.5" stroke-dasharray="1,7" stroke-linecap="round"/>

    <!-- flowing signal dot along active segment -->
    <circle r="3.5" fill="#e8eaf6" filter="url(#blur_glow)">
      <animateMotion dur="2s" repeatCount="indefinite" path="M60,145 L260,145"/>
    </circle>

    <!-- node 1: DSA+CP (done/active) -->
    <circle cx="60" cy="145" r="15" fill="#9ece6a"/>
    <g style="color:#0d0e14"><use href="#ic-code" xlink:href="#ic-code" x="53" y="138" width="14" height="14"/></g>

    <!-- node 2: Placements (CURRENT — pulsing) -->
    <circle cx="260" cy="145" r="15" fill="#7aa2f7" class="ping" opacity="0.7"/>
    <circle cx="260" cy="145" r="15" fill="#7aa2f7"/>
    <g style="color:#0d0e14"><use href="#ic-briefcase" xlink:href="#ic-briefcase" x="253" y="138" width="14" height="14"/></g>

    <!-- node 3,4,5 future -->
    <circle cx="460" cy="145" r="15" fill="#171a28" stroke="#bb9af7" stroke-width="2"/>
    <g style="color:#bb9af7"><use href="#ic-brain" xlink:href="#ic-brain" x="453" y="138" width="14" height="14"/></g>

    <circle cx="660" cy="145" r="15" fill="#171a28" stroke="#7982a9" stroke-width="2"/>
    <g style="color:#7982a9"><use href="#ic-layers" xlink:href="#ic-layers" x="653" y="138" width="14" height="14"/></g>

    <circle cx="860" cy="145" r="15" fill="#171a28" stroke="#f7768e" stroke-width="2"/>
    <g style="color:#f7768e"><use href="#ic-flag" xlink:href="#ic-flag" x="853" y="138" width="14" height="14"/></g>

    <!-- labels -->
    <text x="60" y="184" text-anchor="middle" class="lbl">DSA + CP</text>
    <text x="260" y="184" text-anchor="middle" class="lbl">Placements</text>
    <text x="460" y="184" text-anchor="middle" class="lbl">AI + ML Core</text>
    <text x="660" y="184" text-anchor="middle" class="lbl">Agentic RAG</text>
    <text x="860" y="184" text-anchor="middle" class="lbl">Germany</text>

    <!-- status + detail -->
    <g class="row" style="animation-delay:0.10s">
      <text x="60" y="204" text-anchor="middle" class="status" fill="#9ece6a">active</text>
      <text x="60" y="222" text-anchor="middle" class="m">488+ solved</text>
    </g>
    <g class="row" style="animation-delay:0.15s">
      <text x="260" y="204" text-anchor="middle" class="status" fill="#7aa2f7">in progress</text>
      <text x="260" y="222" text-anchor="middle" class="m">Oct '26 cycle</text>
    </g>
    <g class="row" style="animation-delay:0.20s">
      <text x="460" y="204" text-anchor="middle" class="status" fill="#bb9af7">building</text>
      <text x="460" y="222" text-anchor="middle" class="m">Python &#183; Stats &#183; DL</text>
    </g>
    <g class="row" style="animation-delay:0.25s">
      <text x="660" y="204" text-anchor="middle" class="status" fill="#7982a9">queued</text>
      <text x="660" y="222" text-anchor="middle" class="m">LangGraph &#183; MCP</text>
    </g>
    <g class="row" style="animation-delay:0.30s">
      <text x="860" y="204" text-anchor="middle" class="status" fill="#f7768e">target</text>
      <text x="860" y="222" text-anchor="middle" class="m">Blue Card path</text>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="918.5" height="258.5" rx="19.5" fill="none" stroke="url(#edge_road)" stroke-width="1.4" opacity="0.7"/>
</svg>
