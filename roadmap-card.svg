<svg width="940" height="266" viewBox="0 0 940 266" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip_roadmap"><rect width="940" height="266" rx="20"/></clipPath>
    <linearGradient id="edge_roadmap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9ece6a" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="glass_roadmap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb1_roadmap" cx="15%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2_roadmap" cx="100%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur_roadmap"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="soft_roadmap" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .k{fill:#9ece6a;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:14px;font-weight:700;}
    .v{fill:#e8eaf6;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:14px;}
    .m{fill:#7982a9;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:12.5px;}
    .b{fill:#7aa2f7;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:14px;font-weight:700;}
    .title{fill:#7982a9;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:12.5px;letter-spacing:.4px;}
    .prompt{fill:#9ece6a;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:13px;}
    .cursor{animation:blink 1.1s step-end infinite;}
    @keyframes blink{50%{opacity:0;}}
    .dot-live{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.82);}}
    .row{opacity:1;animation:rise .6s cubic-bezier(.16,1,.3,1) both;}
    @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
    .sheen{animation:sheen 6s ease-in-out infinite;}
    @keyframes sheen{0%,100%{opacity:.5;}50%{opacity:1;}}
    .float{animation:float 5s ease-in-out infinite;}
    @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  </style>
  <g clip-path="url(#clip_roadmap)">
    <rect width="940" height="266" fill="#0d0e14"/>
    <rect width="940" height="266" fill="url(#orb1_roadmap)"/>
    <rect width="940" height="266" fill="url(#orb2_roadmap)"/>
    <rect width="940" height="266" fill="url(#glass_roadmap)"/>
    <rect width="940" height="42" fill="#0a0a0f" opacity="0.75"/>
    <rect x="0" y="41" width="940" height="1.6" fill="url(#edge_roadmap)" class="sheen"/>
    <circle cx="23" cy="21" r="6" fill="#f7768e"/><circle cx="43" cy="21" r="6" fill="#e0af68"/>
    <circle cx="63" cy="21" r="6" fill="#9ece6a" class="dot-live"/>
    <text x="470.0" y="26" text-anchor="middle" class="title">sonam@github — roadmap</text>
    <text x="30" y="88" class="prompt">~ % cat roadmap.md</text>
    <g class="row" style="animation-delay:0.15s">
      <text x="60" y="144" text-anchor="middle" class="v" font-size="13.5" font-weight="700">DSA + CP</text>
      <circle cx="60" cy="176" r="11" fill="#9ece6a" stroke="#9ece6a" stroke-width="2.5" filter="url(#soft_roadmap)"/>
      <text x="60" y="210" text-anchor="middle" fill="#9ece6a" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="12" font-weight="700">active</text>
      <text x="60" y="232" text-anchor="middle" class="m" font-size="11">488+ solved</text>
    </g>
    <g class="row" style="animation-delay:0.27s">
      <text x="265" y="144" text-anchor="middle" class="v" font-size="13.5" font-weight="700">Placements</text>
      <line x1="71" y1="176" x2="254" y2="176" stroke="#9ece6a" stroke-width="2.5" opacity="0.8"/>
      <circle cx="265" cy="176" r="11" fill="#0d0e14" stroke="#7aa2f7" stroke-width="2.5"/>
      <text x="265" y="210" text-anchor="middle" fill="#7aa2f7" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="12" font-weight="700">in progress</text>
      <text x="265" y="232" text-anchor="middle" class="m" font-size="11">Oct '26 cycle</text>
    </g>
    <g class="row" style="animation-delay:0.39s">
      <text x="470" y="144" text-anchor="middle" class="v" font-size="13.5" font-weight="700">AI + ML Core</text>
      <line x1="276" y1="176" x2="459" y2="176" stroke="#7aa2f7" stroke-width="2.5" opacity="0.8"/>
      <circle cx="470" cy="176" r="11" fill="#0d0e14" stroke="#bb9af7" stroke-width="2.5"/>
      <text x="470" y="210" text-anchor="middle" fill="#bb9af7" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="12" font-weight="700">building</text>
      <text x="470" y="232" text-anchor="middle" class="m" font-size="11">Python . Stats . DL</text>
    </g>
    <g class="row" style="animation-delay:0.51s">
      <text x="675" y="144" text-anchor="middle" class="v" font-size="13.5" font-weight="700">Agentic RAG</text>
      <line x1="481" y1="176" x2="664" y2="176" stroke="#bb9af7" stroke-width="2.5" opacity="0.8"/>
      <circle cx="675" cy="176" r="11" fill="#0d0e14" stroke="#7982a9" stroke-width="2.5"/>
      <text x="675" y="210" text-anchor="middle" fill="#7982a9" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="12" font-weight="700">queued</text>
      <text x="675" y="232" text-anchor="middle" class="m" font-size="11">LangGraph . MCP</text>
    </g>
    <g class="row" style="animation-delay:0.63s">
      <text x="880" y="144" text-anchor="middle" class="v" font-size="13.5" font-weight="700">Germany</text>
      <line x1="686" y1="176" x2="869" y2="176" stroke="#7982a9" stroke-width="2.5" opacity="0.8"/>
      <circle cx="880" cy="176" r="11" fill="#0d0e14" stroke="#f7768e" stroke-width="2.5"/>
      <text x="880" y="210" text-anchor="middle" fill="#f7768e" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="12" font-weight="700">target</text>
      <text x="880" y="232" text-anchor="middle" class="m" font-size="11">Blue Card path</text>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="938.5" height="264.5" rx="19.5" fill="none" stroke="url(#edge_roadmap)" stroke-width="1.4" opacity="0.7"/>
</svg>
