<svg width="920" height="230" viewBox="0 0 920 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip_phil"><rect width="920" height="230" rx="20"/></clipPath>
    <linearGradient id="edge_phil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9ece6a" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="glass_phil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb1_phil" cx="15%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2_phil" cx="100%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .quote{fill:#c0caf5;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:13px;}
    .title{fill:#7982a9;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:12.5px;letter-spacing:.4px;}
    .prompt{fill:#9ece6a;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:13px;}
    .dot-live{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.82);}}
    .row{opacity:1;animation:rise .7s cubic-bezier(.16,1,.3,1) both;}
    @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
    .sheen{animation:sheen 6s ease-in-out infinite;}
    @keyframes sheen{0%,100%{opacity:.5;}50%{opacity:1;}}
  </style>
  <g clip-path="url(#clip_phil)">
    <rect width="920" height="230" fill="#0d0e14"/>
    <rect width="920" height="230" fill="url(#orb1_phil)"/>
    <rect width="920" height="230" fill="url(#orb2_phil)"/>
    <rect width="920" height="230" fill="url(#glass_phil)"/>
    <rect width="920" height="42" fill="#0a0a0f" opacity="0.75"/>
    <rect x="0" y="41" width="920" height="1.6" fill="url(#edge_phil)" class="sheen"/>
    <circle cx="23" cy="21" r="6" fill="#f7768e"/><circle cx="43" cy="21" r="6" fill="#e0af68"/>
    <circle cx="63" cy="21" r="6" fill="#9ece6a" class="dot-live"/>
    <text x="460.0" y="26" text-anchor="middle" class="title">sonam@github — philosophy</text>

    <text x="40" y="70" class="prompt">~ % echo $ENGINEERING_PHILOSOPHY</text>

    <text x="46" y="110" fill="#bb9af7" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="34" opacity="0.25">&#8220;</text>

    <g class="row" style="animation-delay:0.10s">
      <text x="460" y="122" text-anchor="middle" class="quote">consistency compounds — 200+ day streaks aren't motivation, they're infrastructure.</text>
    </g>
    <g class="row" style="animation-delay:0.20s">
      <text x="460" y="152" text-anchor="middle" class="quote">solve the pattern, not the problem. debug the fundamentals, not the symptom.</text>
    </g>
    <g class="row" style="animation-delay:0.30s">
      <text x="460" y="182" text-anchor="middle" class="quote">ship it, measure it, then make it smarter.</text>
    </g>

    <text x="874" y="205" fill="#bb9af7" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="34" opacity="0.25">&#8221;</text>
  </g>
  <rect x="0.75" y="0.75" width="918.5" height="228.5" rx="19.5" fill="none" stroke="url(#edge_phil)" stroke-width="1.4" opacity="0.7"/>
</svg>
