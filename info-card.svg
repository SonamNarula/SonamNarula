<svg width="600" height="380" viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip_info"><rect width="600" height="380" rx="20"/></clipPath>
    <linearGradient id="edge_info" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9ece6a" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="glass_info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb1_info" cx="15%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2_info" cx="100%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur_info"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="soft_info" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .k{fill:#9ece6a;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:14px;font-weight:700;}
    .v{fill:#e8eaf6;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:14px;}
    .m{fill:#7982a9;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:12.5px;}
    .b{fill:#7aa2f7;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:14px;font-weight:700;}
    .title{fill:#7982a9;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:12.5px;letter-spacing:.4px;}
    .prompt{fill:#9ece6a;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:13px;}
    .cursor{animation:blink 1.1s step-end infinite;}
    @keyframes blink{50%{opacity:0;}}
    .dot-live{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.82);}}
    .row{opacity:1;animation:rise .6s cubic-bezier(.16,1,.3,1) both;}
    @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
    .sheen{animation:sheen 6s ease-in-out infinite;}
    @keyframes sheen{0%,100%{opacity:.5;}50%{opacity:1;}}
    .float{animation:float 5s ease-in-out infinite;}
    @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  </style>
  <g clip-path="url(#clip_info)">
    <rect width="600" height="380" fill="#0d0e14"/>
    <rect width="600" height="380" fill="url(#orb1_info)"/>
    <rect width="600" height="380" fill="url(#orb2_info)"/>
    <rect width="600" height="380" fill="url(#glass_info)"/>
    <rect width="600" height="42" fill="#0a0a0f" opacity="0.75"/>
    <rect x="0" y="41" width="600" height="1.6" fill="url(#edge_info)" class="sheen"/>
    <circle cx="23" cy="21" r="6" fill="#f7768e"/><circle cx="43" cy="21" r="6" fill="#e0af68"/>
    <circle cx="63" cy="21" r="6" fill="#9ece6a" class="dot-live"/>
    <text x="300.0" y="26" text-anchor="middle" class="title">sonam@github — whoami</text>
    <text x="28" y="88" class="prompt">~ % whoami --verbose</text>
    <g class="row" style="animation-delay:0.10s">
      <rect x="28" y="113" width="4" height="20" rx="2" fill="#7aa2f7" opacity="0.9"/>
      <text x="42" y="132" class="k">Now</text>
      <text x="178" y="132" class="v">Final-year CSE @ JECRC (Oct '26 placements)</text>
    </g>
    <g class="row" style="animation-delay:0.18s">
      <rect x="28" y="151" width="4" height="20" rx="2" fill="#bb9af7" opacity="0.9"/>
      <text x="42" y="170" class="k">Prev</text>
      <text x="178" y="170" class="v">CodeFusion . Trackify</text>
    </g>
    <g class="row" style="animation-delay:0.26s">
      <rect x="28" y="189" width="4" height="20" rx="2" fill="#7dcfff" opacity="0.9"/>
      <text x="42" y="208" class="k">Stack</text>
      <text x="178" y="208" class="v">C++ . React . Node.js . TypeScript</text>
    </g>
    <g class="row" style="animation-delay:0.34s">
      <rect x="28" y="227" width="4" height="20" rx="2" fill="#9ece6a" opacity="0.9"/>
      <text x="42" y="246" class="k">Track</text>
      <text x="178" y="246" class="v">AI/ML foundations . ICPC-style CP</text>
    </g>
    <g class="row" style="animation-delay:0.42s">
      <rect x="28" y="265" width="4" height="20" rx="2" fill="#e0af68" opacity="0.9"/>
      <text x="42" y="284" class="k">Leadership</text>
      <text x="178" y="284" class="v">DSA Captain @ Devcrest JU (400+ members)</text>
    </g>
    <g class="row" style="animation-delay:0.50s">
      <rect x="28" y="303" width="4" height="20" rx="2" fill="#f7768e" opacity="0.9"/>
      <text x="42" y="322" class="k">Goal</text>
      <text x="178" y="322" class="v">SWE role in Germany <tspan class="cursor">█</tspan></text>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="598.5" height="378.5" rx="19.5" fill="none" stroke="url(#edge_info)" stroke-width="1.4" opacity="0.7"/>
</svg>
