name: Update README Stats

on:
  push:
    branches: [main]
    paths-ignore:
      - 'metrics-panel.svg'
  schedule:
    # Runs daily at 00:30 UTC (~6:00 AM IST) as a safety-net
    - cron: "30 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run stats generator
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: SonamNarula
        run: python generate_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics-panel.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update live stats [skip ci]"
            git push
          fi
